openapi: "3.0.0"
info:
  title: Runtime Validation API
  version: "1.0.0"
paths: {}
components:
  schemas:
    ValidationPayload:
      type: object
      required:
        - code
        - amount
        - threshold
        - quantity
        - tags
        - state
        - email
        - identifier
        - birthDate
        - occurredAt
        - callback
        - child
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 5
          pattern: '^[A-Z]+$'
        optionalCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 5
        amount:
          type: integer
          minimum: 1
          maximum: 10
        threshold:
          type: number
          minimum: 1
          exclusiveMinimum: true
          maximum: 10
          exclusiveMaximum: true
        quantity:
          type: integer
          multipleOf: 2
        tags:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          items:
            type: string
        state:
          type: string
          enum:
            - active
            - archived
        email:
          type: string
          format: email
        identifier:
          type: string
          format: uuid
        birthDate:
          type: string
          format: date
        occurredAt:
          type: string
          format: date-time
        callback:
          type: string
          format: uri
        child:
          $ref: '#/components/schemas/ValidationChild'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ValidationChild'
    ValidationChild:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 2
