openapi: "3.0.0"
info:
  title: Header Cookie Error Test API
  version: "1.0.0"
paths:
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      tags:
        - widgets
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
        - name: session
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Widget returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          description: Widget not found
components:
  schemas:
    Widget:
      type: object
      required:
        - id
      properties:
        id:
          type: string
